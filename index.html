<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sqwid Messenger</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="sqwidSplash">
    <div class="sqwid-splash-logo">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="splashFlameOuter" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#7c2d12"/>
        <stop offset="35%" stop-color="#ea580c"/>
        <stop offset="70%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#fbbf24"/>
      </linearGradient>
      <linearGradient id="splashFlameInner" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="55%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <radialGradient id="splashGlow" cx="50%" cy="55%">
        <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
        <stop offset="60%" stop-color="#ea580c" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <filter id="splashBlur">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
    </defs>
    <ellipse cx="100" cy="120" rx="80" ry="70" fill="url(#splashGlow)"/>
    <path d="M100 30 C 105 60, 128 78, 128 112 C 128 135, 114 152, 100 152 C 86 152, 72 135, 72 112 C 72 78, 95 60, 100 30 Z" fill="url(#splashFlameOuter)" filter="url(#splashBlur)" opacity="0.65"/>
    <path d="M100 38 C 104 62, 122 82, 122 112 C 122 130, 111 145, 100 145 C 89 145, 78 130, 78 112 C 78 82, 96 62, 100 38 Z" fill="url(#splashFlameOuter)"/>
    <path d="M100 68 C 102 84, 113 100, 113 118 C 113 130, 107 140, 100 140 C 93 140, 87 130, 87 118 C 87 100, 98 84, 100 68 Z" fill="url(#splashFlameInner)"/>
    <circle cx="100" cy="115" r="2.5" fill="#fbbf24"/>
    <circle cx="106" cy="120" r="2" fill="#ffffff"/>
    <circle cx="94" cy="120" r="1.8" fill="#fbbf24"/>
  </svg>
</div>
    <div class="sqwid-splash-name">Sqwid</div>
    <div class="sqwid-splash-loader">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- ЭКРАН 1: ВХОД -->
  <div id="screen-login" class="screen active">
    <h1 class="app-title">Sqwid</h1>

    <div class="login-fields">
      <input id="loginEmail" type="email" placeholder="Введите email" autocomplete="email">
      <input id="loginPassword" type="password" placeholder="Введите пароль" autocomplete="current-password">
      <button id="btnForgotPassword" class="link-btn">Забыли пароль?</button>
      <button id="btnGoRegister" class="link-btn">Зарегистрироваться</button>
    </div>

    <button id="btnLogin" class="big-gradient-btn">ВОЙТИ</button>
  </div>

  <!-- ЭКРАН 2: РЕГИСТРАЦИЯ -->
  <div id="screen-register" class="screen">
    <button id="btnBackToLogin" class="back-btn" aria-label="Назад">←</button>

    <div class="register-body">

      <label class="reg-avatar-wrap">
        <input id="regAvatarInput" type="file" accept="image/*" style="display:none;">
        <div class="reg-avatar" id="regAvatarPreview"></div>
      </label>

      <div class="reg-field">
        <div class="reg-label">введите ваш email</div>
        <input id="regEmail" type="email" autocomplete="email">
      </div>

      <div class="reg-field">
        <div class="reg-label">придумайте пароль</div>
        <div class="reg-pass-wrap">
          <input id="regPassword" type="password" autocomplete="new-password">
          <button type="button" class="eye-btn" id="btnTogglePass">👁</button>
        </div>
      </div>

      <div class="reg-field">
        <div class="reg-label">как вас зовут?</div>
        <input id="regName" type="text" maxlength="30">
      </div>

    </div>

    <button id="btnContinue" class="big-gradient-btn">ПРОДОЛЖИТЬ</button>
    <div id="regStatus" class="reg-status"></div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
